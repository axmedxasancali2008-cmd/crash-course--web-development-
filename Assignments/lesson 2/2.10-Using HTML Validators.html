<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed's Bio</title>
</head>
<body>

    <header id="home">
        <h1>Ahmed Hassan</h1>
    </header>

    <main>

        <section id="about" class="bio-section">

            <img
                src="/lessons/AhA.jpeg"
                alt="Professional photo of Ahmed Hassan"
                width="50" style="border-radius: 100%;"
            >

            <p>
                I am a Computer Science student interested in
                web development, artificial intelligence, and technology.
            </p>
        </section>

        <section id="contact" class="contact-section">
            <h2>Contact Me</h2>

            <form>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="message">Message:</label> <br>
                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    required
                ></textarea>

                <br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ahmed Hassan</p>
    </footer>

</body>
</html>
